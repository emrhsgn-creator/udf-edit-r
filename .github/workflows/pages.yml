name: Web sürümünü yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Arayüzü derle
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: www klasörünü paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Yayınla
        id: dagit
        uses: actions/deploy-pages@v4
