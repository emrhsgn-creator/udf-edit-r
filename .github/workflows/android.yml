name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ortamı göster
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          java -version
          node -v

      - name: Bağımlılıkları kur
        run: npm install

      - name: Arayüzü derle
        run: npm run build

      - name: Android projesini üret
        run: npx cap add android

      - name: Dosya ilişkilendirmesini ekle
        run: node scripts/patch-android.mjs

      - name: Web katmanını kopyala
        run: npx cap sync android

      - name: APK derle
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: udf-editor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
